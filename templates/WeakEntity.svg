<g class="entity entity-weak">
  <rect x="{%x%}" y="{%y%}" width="{%w%}" height="{%h%}" fill="white" stroke="black" />
  <rect x="{%x2%}" y="{%y2%}" width="{%w2%}" height="{%h2%}" fill="white" stroke="black" />
  <text x="{%cx%}" y="{%cy%}" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="12">{%text%}</text>
</g>
