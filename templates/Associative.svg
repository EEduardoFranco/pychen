<g class="associative">
  <rect x="{%x%}" y="{%y%}" width="{%w%}" height="{%h%}" fill="white" stroke="black" />
  <polygon points="{%points%}" fill="white" stroke="black" />
  <text x="{%cx%}" y="{%cy%}" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="11">{%text%}</text>
</g>
