[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pychen"
version = "1.0.0"
description = "DSL em Python para diagramas conceituais de banco de dados (notação de Chen) com renderização SVG."
license = "MIT"
authors = [{ name = "Eduardo Franco", email = "dudufranco25@gmail.com" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "syrupy",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["pychen*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_dot: testes de layout que exigem o executable `dot` do graphviz no PATH",
]
